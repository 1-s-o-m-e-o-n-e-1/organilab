<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10251f"><title>OrganiLab Academy</title><style>
:root{color-scheme:dark;--bg:#101a23;--panel:#192a36;--ink:#edf5f4;--muted:#a3b9bd;--accent:#80e2ba;--line:#354b54}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,sans-serif}header{border-bottom:1px solid var(--line);padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header strong{font-size:24px;letter-spacing:-1px}nav{display:flex;gap:6px;flex-wrap:wrap}button,select,input{font:inherit}button,select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 15px;cursor:pointer}button:hover,button:focus-visible{border-color:var(--accent)}button.primary{background:var(--accent);color:#112d23;font-weight:700}main{max-width:1100px;margin:auto;padding:30px 20px}.hero{background:linear-gradient(130deg,#23483f,#192c41);padding:32px;border-radius:22px;margin-bottom:20px}h1,h2,h3,p{margin:0 0 12px}h1{font-size:clamp(30px,5vw,48px);line-height:1.15}small,.muted{color:var(--muted)}.tag{color:var(--accent);font-size:12px;letter-spacing:2px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}.tile{text-align:left;width:100%}.tile b{display:block;font-size:19px}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.bar{height:8px;border-radius:9px;background:#354b54;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}.option{display:block;width:100%;text-align:left;margin:8px 0}.good{border-color:#80e2ba;background:#214e3c}.bad{border-color:#ed8999;background:#532c38}canvas{display:block;width:100%;height:330px;background:radial-gradient(ellipse,#29465b,#0d1927 75%);border-radius:15px;touch-action:none;cursor:grab}input[type=range]{width:100%;accent-color:var(--accent)}.formula{background:#0c1926;border-radius:12px;padding:20px;text-align:center;font-size:24px;overflow-wrap:anywhere}.enter{animation:enter .25s ease-out}@keyframes enter{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}a{color:var(--accent)}footer{padding:20px;text-align:center;color:var(--muted)}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><script defer src="app.js"></script></head><body><header><strong>⚛ OrganiLab<span style="color:var(--accent)">.</span></strong><nav><button data-nav="home">Accueil</button><button data-nav="courses">Parcours</button><button data-nav="models">Molécules 3D</button><button data-nav="lab">Laboratoire</button><button data-nav="quiz">QCM</button></nav></header><main id="app"><p>Chargement…</p></main><footer>OrganiLab Academy · Pharmacie S3 · Ressource pédagogique indépendante</footer></body></html>
